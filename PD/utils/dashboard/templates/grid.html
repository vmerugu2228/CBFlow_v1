<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RACE Grid — {{FLOW_TYPE}}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="topnav">
  <div class="nav-brand">RACE Dashboard</div>
  <div class="nav-links">
    <a href="/">Overview</a>
    <a href="/dag">DAG</a>
    <a href="/grid" class="active">Grid</a>
  </div>
  <div class="nav-info"><span>{{FLOW_TYPE}}</span></div>
</nav>

<main class="container">
  <div class="header-card" style="justify-content:flex-start;gap:20px">
    <h1>Job Grid — {{FLOW_TYPE}}</h1>
    <div style="display:flex;gap:8px;align-items:center">
      <input type="text" id="search" placeholder="Search jobs..." style="padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;width:200px">
      <select id="filter-status" style="padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px">
        <option value="">All Status</option>
        <option value="DONE">Done</option>
        <option value="FAIL">Failed</option>
        <option value="RUNNING">Running</option>
        <option value="READY">Ready</option>
        <option value="PENDING">Pending</option>
        <option value="INVALIDATED">Invalidated</option>
        <option value="BYPASSED">Bypassed</option>
      </select>
      <select id="filter-stage" style="padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px">
        <option value="">All Stages</option>
      </select>
    </div>
  </div>

  <div class="table-section">
    <table class="data-table" id="job-table">
      <thead>
        <tr>
          <th onclick="sortTable(0)">Job ↕</th>
          <th onclick="sortTable(1)">Stage ↕</th>
          <th onclick="sortTable(2)">Subnode ↕</th>
          <th onclick="sortTable(3)">Type ↕</th>
          <th onclick="sortTable(4)">Status ↕</th>
          <th onclick="sortTable(5)">Runtime ↕</th>
          <th onclick="sortTable(6)">Exit ↕</th>
          <th onclick="sortTable(7)">Host</th>
          <th>Error</th>
        </tr>
      </thead>
      <tbody id="grid-body"></tbody>
    </table>
    <div class="grid-footer" id="grid-footer" style="padding:10px;font-size:12px;color:var(--text-dim)"></div>
  </div>
</main>

<!-- Job Details Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3 id="modal-title">Job Details</h3>
      <button onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
let allJobs = [];
let sortCol = -1, sortAsc = true;

function statusColor(s) {
  return {READY:'#c8a600',PENDING:'#00838f',RUNNING:'#2e7d32',DONE:'#00838f',
          FAIL:'#b71c1c',INVALIDATED:'#7b1fa2',
          BYPASSED:'#e65100',FORCE_VALIDATED:'#00695c'}[s] || '#757575';
}
function formatTime(s) { if (!s || s < 0.01) return '-'; return s < 60 ? s.toFixed(1)+'s' : (s/60).toFixed(1)+'m'; }

function loadJobs() {
  fetch('/api/jobs').then(r => r.json()).then(jobs => {
    allJobs = jobs;
    // Populate stage filter
    const stageSelect = document.getElementById('filter-stage');
    const stages = [...new Set(jobs.map(j => j.stage))];
    if (stageSelect.options.length <= 1) {
      stages.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; stageSelect.add(o); });
    }
    renderGrid();
  });
}

function renderGrid() {
  const search = document.getElementById('search').value.toLowerCase();
  const filterStatus = document.getElementById('filter-status').value;
  const filterStage = document.getElementById('filter-stage').value;

  let filtered = allJobs.filter(j => {
    if (search && !j.name.toLowerCase().includes(search)) return false;
    if (filterStatus && j.status !== filterStatus) return false;
    if (filterStage && j.stage !== filterStage) return false;
    return true;
  });

  if (sortCol >= 0) {
    const keys = ['name','stage','subnode','type','status','runtime','exit_code','hostname'];
    const key = keys[sortCol];
    filtered.sort((a, b) => {
      let va = a[key] || '', vb = b[key] || '';
      if (typeof va === 'number' && typeof vb === 'number') return sortAsc ? va - vb : vb - va;
      return sortAsc ? String(va).localeCompare(String(vb)) : String(vb).localeCompare(String(va));
    });
  }

  const tbody = document.getElementById('grid-body');
  tbody.innerHTML = filtered.map(j => {
    const color = statusColor(j.status);
    return '<tr onclick="showJob(\'' + j.name + '\')" style="cursor:pointer">' +
      '<td><strong>' + j.name + '</strong></td>' +
      '<td>' + j.stage + '</td>' +
      '<td>' + (j.subnode || '-') + '</td>' +
      '<td>' + (j.type || '-') + '</td>' +
      '<td><span class="status-badge" style="background:' + color + '">' + j.status + '</span></td>' +
      '<td class="mono">' + formatTime(j.runtime) + '</td>' +
      '<td>' + (j.exit_code != null ? j.exit_code : '-') + '</td>' +
      '<td class="mono">' + (j.hostname || '-') + '</td>' +
      '<td class="error-text">' + (j.error || '') + '</td></tr>';
  }).join('');

  document.getElementById('grid-footer').textContent =
    'Showing ' + filtered.length + ' of ' + allJobs.length + ' jobs';
}

function sortTable(col) {
  if (sortCol === col) sortAsc = !sortAsc;
  else { sortCol = col; sortAsc = true; }
  renderGrid();
}

function showJob(name) {
  fetch('/api/job/' + name).then(r => r.json()).then(j => {
    if (!j.name) return;
    const color = statusColor(j.status);
    let html = '<div class="detail-grid">' +
      '<div><label>Status</label><span class="status-badge" style="background:'+color+'">'+j.status+'</span></div>' +
      '<div><label>Runtime</label>'+formatTime(j.runtime)+'</div>' +
      '<div><label>Exit Code</label>'+(j.exit_code!=null?j.exit_code:'-')+'</div>' +
      '<div><label>Stage</label>'+j.stage+'</div>' +
      '<div><label>Subnode</label>'+(j.subnode||'-')+'</div>' +
      '<div><label>Type</label>'+(j.type||'-')+'</div>' +
      '<div><label>Host</label><span class="mono">'+(j.hostname||'-')+'</span></div>' +
      '<div><label>LSF Job</label><span class="mono">'+(j.lsf_job_id||'-')+'</span></div>' +
      '<div><label>Tier</label>'+(j.resource_tier||'-')+'</div>' +
      '<div><label>Start</label><span class="mono">'+(j.start_time||'-')+'</span></div>' +
      '<div><label>End</label><span class="mono">'+(j.end_time||'-')+'</span></div>' +
      '<div><label>Retries</label>'+(j.retry_count||0)+'</div></div>';
    if (j.error_msg) html += '<div class="error-box"><strong>Error:</strong> '+j.error_msg+'</div>';
    if (j.command) html += '<div class="cmd-box"><strong>Command:</strong><pre>'+j.command+'</pre></div>';
    if (j.log_tail && j.log_tail.length > 0) {
      html += '<div class="log-box"><strong>Log:</strong><pre>'+j.log_tail.join('\n')+'</pre></div>';
    }
    document.getElementById('modal-title').textContent = j.name;
    document.getElementById('modal-body').innerHTML = html;
    document.getElementById('modal-overlay').style.display = 'flex';
  });
}

function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
document.getElementById('search').addEventListener('input', renderGrid);
document.getElementById('filter-status').addEventListener('change', renderGrid);
document.getElementById('filter-stage').addEventListener('change', renderGrid);

loadJobs();
setInterval(loadJobs, 5000);
</script>
</body>
</html>
