<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RACE DAG — {{FLOW_TYPE}}</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/adaptive_poll.js"></script>
</head>
<body>
<nav class="topnav">
  <div class="nav-brand">RACE Dashboard <span id="nav-disc" style="font-size:10px;font-weight:700;letter-spacing:.08em;padding:2px 8px;border-radius:999px;background:#1565c0;color:#fff;text-transform:uppercase;border:1px solid #0d47a1;margin-left:8px">{{DISCIPLINE}}</span></div>
  <div class="nav-links">
    <a href="/">Overview</a>
    <a href="/dag" class="active">DAG</a>
    <a href="/grid">Grid</a>
  </div>
  <div class="nav-info"><span>{{FLOW_TYPE}}</span></div>
</nav>
<script>
  (function() {
    var el = document.getElementById('nav-disc');
    if (el && el.textContent.trim() === 'DFT') {
      el.style.background = '#0d9488';
      el.style.borderColor = '#0f766e';
    }
  })();
</script>

<main class="container">
  <div class="header-card">
    <h1>Dependency Graph — {{FLOW_TYPE}}</h1>
    <div style="display:flex;gap:16px;align-items:center">
      <span class="legend-item"><span class="dot" style="background:#059669"></span> Done</span>
      <span class="legend-item"><span class="dot" style="background:#dc2626"></span> Fail</span>
      <span class="legend-item"><span class="dot" style="background:#2563eb"></span> Running</span>
      <span class="legend-item"><span class="dot" style="background:#6b7280"></span> Pending</span>
      <span class="legend-item"><span class="dot" style="background:#d97706"></span> Bypassed</span>
    </div>
  </div>

  <div class="dag-container" id="dag-container">
    <svg id="dag-svg" width="100%" height="600"></svg>
  </div>
</main>

<!-- Job Details Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3 id="modal-title">Job Details</h3>
      <button onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<style>
.legend-item { display:flex; align-items:center; gap:4px; font-size:12px; color:var(--text-dim); }
.dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
.dag-container { background:var(--surface); border-radius:10px; padding:20px; border:1px solid var(--border); overflow:auto; }
.dag-node { cursor:pointer; transition: opacity 0.2s; }
.dag-node:hover { opacity:0.8; }
.dag-label { font-size:11px; fill:white; font-weight:600; text-anchor:middle; pointer-events:none; }
.dag-arrow { stroke:#334155; stroke-width:2; fill:none; marker-end:url(#arrowhead); opacity:0.85; }
.dag-arrow.bypass { stroke:#94a3b8; stroke-dasharray:5,4; stroke-width:1.75; }
.ctx-menu { position:fixed; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:4px 0; min-width:180px; box-shadow:0 8px 24px rgba(0,0,0,0.3); z-index:1000; display:none; }
.ctx-menu .ctx-header { padding:8px 14px; font-size:11px; font-weight:700; color:var(--text-dim); border-bottom:1px solid var(--border); }
.ctx-menu a { display:block; padding:8px 14px; color:var(--text); text-decoration:none; font-size:13px; cursor:pointer; }
.ctx-menu a:hover { background:var(--primary); color:white; }
.ctx-menu .ctx-sep { border-top:1px solid var(--border); margin:4px 0; }
</style>

<!-- Right-click context menu -->
<div class="ctx-menu" id="ctx-menu">
  <div class="ctx-header" id="ctx-title">Node</div>
  <a onclick="ctxAction('retrace')">&#8635; Retrace from here</a>
  <a onclick="ctxAction('run-stage')">&#9654; Rerun this node</a>
  <div class="ctx-sep"></div>
  <a onclick="ctxAction('bypass')">&#9723; Bypass</a>
  <a onclick="ctxAction('forcevalidate')">&#10004; Force Validate</a>
  <a onclick="ctxAction('force-stop')" style="color:#b71c1c">&#9632; Force Stop</a>
  <div class="ctx-sep"></div>
  <a onclick="showJob(ctxNode)">&#128269; View Details</a>
</div>

<script>
function statusColor(s) {
  return {READY:'#c8a600',PENDING:'#00838f',RUNNING:'#2e7d32',DONE:'#00838f',
          FAIL:'#b71c1c',INVALIDATED:'#7b1fa2',
          BYPASSED:'#e65100',FORCE_VALIDATED:'#00695c'}[s] || '#757575';
}
function formatTime(s) { return s < 60 ? s.toFixed(1)+'s' : (s/60).toFixed(1)+'m'; }

function renderDAG(data) {
  const svg = document.getElementById('dag-svg');
  const stages = data.stage_order || [];
  const stageDeps = data.stage_deps || {};
  const nodes = data.nodes || [];
  const nodeMap = {};
  nodes.forEach(n => nodeMap[n.id] = n);

  // ── Compute topological level (longest path from any root) ──
  // Level 0 = no deps (input roots). Every other stage = 1 + max(dep levels).
  // Stages with the same level render in the same column; parallel branches
  // stack vertically. This replaces the old "flat horizontal chain" that
  // ignored the actual DAG topology.
  const level = {};
  function levelOf(stage) {
    if (stage in level) return level[stage];
    const deps = stageDeps[stage] || [];
    if (deps.length === 0) { level[stage] = 0; return 0; }
    let m = 0;
    for (const d of deps) {
      const dl = levelOf(d) + 1;
      if (dl > m) m = dl;
    }
    level[stage] = m;
    return m;
  }
  stages.forEach(levelOf);

  // Group stages by level → columns.
  const columns = {};
  stages.forEach(s => {
    const L = level[s];
    if (!columns[L]) columns[L] = [];
    columns[L].push(s);
  });
  const maxLevel = Math.max(0, ...Object.keys(columns).map(Number));
  const maxColHeight = Math.max(1, ...Object.values(columns).map(c => c.length));

  // ── Layout ──
  const stageW = 150, stageH = 52;
  const gapX = 50, gapY = 12;
  const padX = 30, padY = 30;

  const totalW = padX * 2 + (maxLevel + 1) * (stageW + gapX);
  const totalH = padY * 2 + maxColHeight * (stageH + gapY);
  svg.setAttribute('width', Math.max(totalW, 800));
  svg.setAttribute('height', Math.max(totalH, 240));

  // Assign (x, y) per stage.
  const pos = {};
  for (let L = 0; L <= maxLevel; L++) {
    const col = columns[L] || [];
    const colH = col.length * stageH + (col.length - 1) * gapY;
    const yOffset = padY + (totalH - 2 * padY - colH) / 2;
    col.forEach((s, i) => {
      pos[s] = {
        x: padX + L * (stageW + gapX),
        y: yOffset + i * (stageH + gapY),
      };
    });
  }

  // ── Detect bypass diamonds and offset intermediate nodes ──
  // For every stage S with exactly one parent P and one child C where P is
  // ALSO a direct parent of C, S is a parallel branch of a "diamond". Offset
  // it above the direct P→C line so the branch is visually distinct instead
  // of sitting flat on top of the direct arrow.
  const childrenOf = {};
  for (const [child, deps] of Object.entries(stageDeps)) {
    for (const p of deps) {
      if (!childrenOf[p]) childrenOf[p] = [];
      childrenOf[p].push(child);
    }
  }
  const bypassParent = {};  // stage → parent (marks diamond intermediates)
  for (const s of stages) {
    const parents = stageDeps[s] || [];
    const kids = childrenOf[s] || [];
    if (parents.length !== 1 || kids.length !== 1) continue;
    const p = parents[0], c = kids[0];
    if ((stageDeps[c] || []).includes(p)) {
      bypassParent[s] = p;
    }
  }
  // Apply vertical offset so the intermediate rides above its two "sibling
  // rails" (the direct P→C arrow). Bounded by stageH so it never leaves the
  // svg.
  for (const s of Object.keys(bypassParent)) {
    if (s in pos) {
      pos[s] = { x: pos[s].x, y: pos[s].y - (stageH + gapY / 2) };
    }
  }

  let html = '<defs><marker id="arrowhead" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">' +
    '<polygon points="0 0, 9 3.5, 0 7" fill="#334155"/></marker>' +
    '<marker id="arrowhead-bypass" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">' +
    '<polygon points="0 0, 9 3.5, 0 7" fill="#94a3b8"/></marker></defs>';

  // ── Draw arrows from real dep edges ──
  // Cubic Bezier so crossing branches (e.g. decomp_merge_gds1 has TWO parents)
  // stay legible. Horizontal control points pull the curve toward the middle
  // of each column so parallel deps don't overlap on top of one another.
  // "Bypass" edges (parent→child where a parallel branch exists) render
  // dashed & lighter so the primary chain remains visually dominant.
  const drawnEdges = new Set();
  for (const [child, deps] of Object.entries(stageDeps)) {
    if (!(child in pos)) continue;
    for (const parent of deps) {
      if (!(parent in pos)) continue;
      const key = parent + '→' + child;
      if (drawnEdges.has(key)) continue;
      drawnEdges.add(key);
      const p = pos[parent], c = pos[child];
      const x1 = p.x + stageW, y1 = p.y + stageH / 2;
      const x2 = c.x,          y2 = c.y + stageH / 2;
      const dx = Math.max(24, (x2 - x1) * 0.4);
      // Detect the "direct" edge of a diamond: parent P has an intermediate
      // hop S with bypassParent[S]==P and S→child. Render P→child dashed.
      let isBypass = false;
      for (const s of (childrenOf[parent] || [])) {
        if (bypassParent[s] === parent && (childrenOf[s] || []).includes(child)) {
          isBypass = true;
          break;
        }
      }
      const cls = isBypass ? 'dag-arrow bypass' : 'dag-arrow';
      const marker = isBypass ? 'url(#arrowhead-bypass)' : 'url(#arrowhead)';
      html += '<path class="' + cls + '" marker-end="' + marker + '" d="M ' + x1 + ' ' + y1 +
              ' C ' + (x1 + dx) + ' ' + y1 + ', ' +
                       (x2 - dx) + ' ' + y2 + ', ' +
                       x2 + ' ' + y2 + '"/>';
    }
  }

  // ── Draw stage nodes ──
  stages.forEach(stage => {
    if (!(stage in pos)) return;
    const { x, y } = pos[stage];
    const n = nodeMap[stage] || {status:'READY'};
    const color = statusColor(n.status);
    const rt = n.runtime ? ' (' + formatTime(n.runtime) + ')' : '';
    html += '<g class="dag-node" onclick="showJob(\'' + stage + '\')" oncontextmenu="showCtxMenu(event,\'' + stage + '\')">' +
      '<rect x="' + x + '" y="' + y + '" width="' + stageW + '" height="' + stageH + '" rx="8" fill="' + color + '" opacity="0.92"/>' +
      '<text class="dag-label" x="' + (x + stageW/2) + '" y="' + (y + 22) + '">' + stage.replace(/1$/,'') + '</text>' +
      '<text class="dag-label" x="' + (x + stageW/2) + '" y="' + (y + 40) + '" style="font-size:10px;opacity:0.85">' + (n.status||'') + rt + '</text>' +
      '</g>';
  });

  svg.innerHTML = html;
}

function showJob(name) {
  fetch('/api/job/' + name).then(r => r.json()).then(j => {
    if (!j.name) { // It's a stage sentinel, show stage jobs
      fetch('/api/jobs').then(r => r.json()).then(jobs => {
        const sj = jobs.filter(x => x.stage === name);
        let html = '<table class="data-table"><thead><tr><th>Job</th><th>Status</th><th>Runtime</th><th>Exit</th></tr></thead><tbody>';
        sj.forEach(x => {
          html += '<tr oncontextmenu="showCtxMenu(event,\'' + x.name + '\')" style="cursor:pointer"><td>' + x.name + '</td><td><span class="status-badge" style="background:' + statusColor(x.status) + '">' + x.status + '</span></td><td>' + formatTime(x.runtime) + '</td><td>' + (x.exit_code!=null?x.exit_code:'-') + '</td></tr>';
        });
        html += '</tbody></table>';
        document.getElementById('modal-title').textContent = name;
        document.getElementById('modal-body').innerHTML = html;
        document.getElementById('modal-overlay').style.display = 'flex';
      });
      return;
    }
    // Show single job details
    const color = statusColor(j.status);
    let html = '<div class="detail-grid">' +
      '<div><label>Status</label><span class="status-badge" style="background:'+color+'">'+j.status+'</span></div>' +
      '<div><label>Runtime</label>'+formatTime(j.runtime)+'</div>' +
      '<div><label>Exit</label>'+(j.exit_code!=null?j.exit_code:'-')+'</div>' +
      '<div><label>Host</label><span class="mono">'+(j.hostname||'-')+'</span></div>' +
      '<div><label>LSF</label><span class="mono">'+(j.lsf_job_id||'-')+'</span></div>' +
      '<div><label>Tier</label>'+(j.resource_tier||'-')+'</div></div>';
    if (j.error_msg) html += '<div class="error-box">'+j.error_msg+'</div>';
    document.getElementById('modal-title').textContent = j.name;
    document.getElementById('modal-body').innerHTML = html;
    document.getElementById('modal-overlay').style.display = 'flex';
  });
}

function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); hideCtxMenu(); } });

// Context menu
var ctxNode = '';
function showCtxMenu(e, node) {
  e.preventDefault();
  ctxNode = node;
  const menu = document.getElementById('ctx-menu');
  document.getElementById('ctx-title').textContent = node;
  menu.style.left = e.clientX + 'px';
  menu.style.top = e.clientY + 'px';
  menu.style.display = 'block';
}
function hideCtxMenu() { document.getElementById('ctx-menu').style.display = 'none'; }
document.addEventListener('click', hideCtxMenu);

function ctxAction(action) {
  hideCtxMenu();
  if (action === 'force-stop' && !confirm('Force stop ' + ctxNode + '? This will kill the running process.')) return;
  const body = action === 'retrace' ? {from: ctxNode} :
               action === 'run-stage' ? {stage: ctxNode} :
               action === 'force-stop' ? {node: ctxNode} :
               {stage: ctxNode};
  fetch('/api/action/' + action, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  }).then(r => r.json()).then(res => {
    if (res.ok) {
      alert(action + ' on ' + ctxNode + ': ' + (res.message || 'OK'));
    } else {
      alert('Error: ' + (res.error || 'Failed'));
    }
    fetch('/api/dag').then(r => r.json()).then(renderDAG);
  }).catch(err => alert('Error: ' + err));
}

const _dagRefresh = () => fetch('/api/dag').then(r => r.json()).then(renderDAG);
if (window.CBfAdaptive) {
  window.CBfAdaptive.start(_dagRefresh);
} else {
  _dagRefresh();
  setInterval(_dagRefresh, 5000);
}
</script>
</body>
</html>
